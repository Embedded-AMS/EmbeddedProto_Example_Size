syntax = "proto3";

// Twenty message types of the same shape. The schema growth scenarios round trip the
// first 1, 5 or 20 of them, so the flash a library spends per message type shows.

message Growth_01
{
  uint32 id = 1;
  int32 value = 2;
  float measure = 3;
  bool flag = 4;
  string label = 5;
}

