// This file demonstrates the oneof feature of Protocol Buffers.

syntax = "proto3";

import "simple_types.proto";

message OneOf_Demo {
  // Oneof group containing multiple field types
  oneof data_field {
    int32 int32_value = 1;
    int64 int64_value = 2;
    uint32 uint32_value = 3;
    uint64 uint64_value = 4;
    bool bool_value = 5;
    float float_value = 6;
    double double_value = 7;
    Simple_Types simple_types_value = 8;
  }
}