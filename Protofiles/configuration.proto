syntax = "proto3";

// The complex message: a oneof per peripheral, nested messages in a repeated field,
// a string and an optional scalar with presence.

message UartConfig
{
  uint32 baud = 1;
  uint32 data_bits = 2;
  bool parity = 3;
}

message SpiConfig
{
  uint32 prescaler = 1;
  bool cpol = 2;
  bool cpha = 3;
}

message MotorConfig
{
  uint32 max_speed = 1;
  bool invert = 2;
  uint32 home_pin = 3;
}

message Peripheral
{
  uint32 index = 1;
  oneof kind
  {
    UartConfig uart = 10;
    SpiConfig spi = 11;
    MotorConfig motor = 12;
  }
}

message Configuration
{
  uint32 version = 1;
  string device_name = 2;
  repeated Peripheral peripherals = 3;
  optional uint32 report_interval_ms = 4;
}
