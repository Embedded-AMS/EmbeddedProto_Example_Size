// Test scenario: simple_types
// Contains all basic protobuf types for size comparison benchmarking.

syntax = "proto3";

package simple_types;

enum TestEnum {
  ENUM_ZERO = 0;
  ENUM_ONE = 1;
  ENUM_TWO = 2;
  ENUM_MAX = 255;
}

message SimpleTypes {
  int32   a_int32   = 1;
  int64   a_int64   = 2;
  uint32  a_uint32  = 3;
  uint64  a_uint64  = 4;
  bool    a_bool    = 5;
  float   a_float   = 6;
  double  a_double  = 7;
  string  a_string  = 8;  // max 32 chars for embedded
  bytes   a_bytes   = 9;  // max 32 bytes for embedded
  TestEnum a_enum   = 10;
}
