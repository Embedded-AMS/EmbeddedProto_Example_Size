syntax = "proto3";

// The buffered upload: twenty small nested samples relative to one timestamp.

message Sample
{
  uint32 offset_ms = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

message TelemetryBatch
{
  uint32 device_id = 1;
  uint64 timestamp = 2;
  repeated Sample samples = 3;
}
