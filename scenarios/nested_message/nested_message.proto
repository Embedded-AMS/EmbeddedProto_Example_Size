// Test scenario: nested_message
// Contains 2-3 levels of message nesting with repeated fields
// for measuring nesting overhead in size comparison benchmarking.

syntax = "proto3";

package nested_message;

// Level 3: Innermost message
message InnerMessage {
  int32 value = 1;
  string name = 2;  // max 16 chars for embedded
}

// Level 2: Middle message with repeated field
message MiddleMessage {
  float x = 1;
  float y = 2;
  float z = 3;
  InnerMessage inner = 4;
  repeated int32 values = 5;  // max 5 elements for embedded
}

// Level 1: Outer message (root)
message OuterMessage {
  int32 id = 1;
  string label = 2;  // max 32 chars for embedded
  MiddleMessage middle = 3;
  repeated MiddleMessage items = 4;  // max 3 elements for embedded
}
