// This file demonstrates repeated fields with length constraints
// for both NanoPB and EmbeddedProto.

syntax = "proto3";

import "simple_types.proto";

// Message with a simple repeated integer field
// Using NanoPB options to set maxLength constraint
message Repeated_Integers {
  repeated int32 values = 1;
}

// Message with repeated Simple_Types messages
// Using NanoPB options to set maxLength constraint.
message Repeated_Messages {
  repeated Simple_Types items = 1;
}

// Message with a repeated message field which in it self also has a repeated message in it.
// Again using NanoPB options to set maxLength constraint.
message Nested_Repeated_Messages {
  repeated Repeated_Messages nested_rm = 1;
}
