syntax = "proto3";

// Fields streamed through user callbacks instead of resident arrays. Embedded Proto
// takes its callbackStorage options from callback_demo.options.json, nanopb takes
// FT_CALLBACK from callback_demo.options, so the schema itself stays shared.

message Sample_Stream
{
  repeated int32 samples = 1;
}

message Blob
{
  bytes payload = 1;
}
