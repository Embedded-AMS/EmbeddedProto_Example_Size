syntax = "proto3";

// The tiny pair: a command with a oneof action and its acknowledgement.

enum Result
{
  UNKNOWN = 0;
  ACCEPTED = 1;
  REJECTED = 2;
  BUSY = 3;
}

message DeviceCommand
{
  uint32 sequence = 1;
  oneof action
  {
    bool set_output = 2;
    sint32 move_to = 3;
    uint32 reboot_delay_ms = 4;
  }
}

message DeviceAck
{
  uint32 sequence = 1;
  Result result = 2;
}
