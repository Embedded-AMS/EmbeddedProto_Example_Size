syntax = "proto3";

// The small message every device sends: mixed widths, an enum and a negative value.

enum Status
{
  OK = 0;
  WARNING = 1;
  ERROR = 2;
}

message Telemetry
{
  uint32 device_id = 1;
  uint64 timestamp = 2;   // ms since boot
  float temperature = 3;
  float humidity = 4;
  uint32 battery_mv = 5;
  Status status = 6;
  int32 rssi = 7;         // negative dBm
}
