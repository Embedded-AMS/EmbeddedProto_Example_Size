// This file demonstrates the optional feature of protobuf with zero values.

syntax = "proto3";

enum Test_Enum {
  ZERO  = 0;
  ONE   = 1;
  TWO   = 2;
  ONEHUNDERTTWENTYSEVEN = 127;
  ONEHUNDERTTWENTYEIGHT = 128;
  TWOHUNDERDFIFTYFIVE   = 255;
  TWOBILLION = 2000000000;
}

message Optional_Demo {
  optional int32       a_int32     = 1;
  optional int64       a_int64     = 2;
  optional uint32      a_uint32    = 3;
  optional uint64      a_uint64    = 4;
  optional sint32      a_sint32    = 5;
  optional sint64      a_sint64    = 6;
  optional bool        a_bool      = 7;
  optional Test_Enum   a_enum      = 8;
  optional fixed64     a_fixed64   = 9;
  optional sfixed64    a_sfixed64  = 10;
  optional double      a_double    = 11;
  optional fixed32     a_fixed32   = 12;
  optional sfixed32    a_sfixed32  = 13;
  optional float       a_float     = 14;

  enum Nested_Enum {
    NE_A = 0;
    NE_B = 1;
    NE_C = 2;
  }

  optional Nested_Enum a_nested_enum = 15;
}